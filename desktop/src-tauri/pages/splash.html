<!DOCTYPE html>
<!-- Splash shown while the sidecar boots dsh AND while the WebUI's own boot
     chain settles inside the hidden main window (boot-watch.js → POST
     /_desktop/boot-settled → show_main_window; see windows.rs). The shell
     keeps this splash up until the WebUI signals boot-settled, so the user
     only ever sees ONE loading screen.

     Branding uses the DSH Desktop identity (matching brand-inject.js in the
     WebUI): the DeepSeek whale mark from assets/icon-source.svg (= the app
     icon), inlined so it stays crisp at any scale. The icon's blues drive
     the whole palette — primary whale body #4D6BFE, secondary #3D58E8,
     light #7C93FF, deep #2E42D4. The card is a deep indigo gradient
     (radial, lit behind the mark: #232c66→#171e4a→#0d1230) with a faint
     periwinkle edge. The brand pill stays WHITE — the whale's deep blues
     (#2E42D4/#3D58E8) would vanish on a dark ground, so the white inner
     acts as the icon plate — bounded by a 1px periwinkle gradient rim
     (135deg, #aabdfe→#dbe5ff→#e6edff→#c3d1ff) plus a soft blue glow; the
     "DSH Desktop" wordmark sits inside in the primary blue #4D6BFE
     (DM Sans 15px/700 — bold synthesized from the embedded 400/500 faces;
     28px whale mark).

     The loading ring + hint ("Loading plugins…") keep the same family
     brightened for the dark ground: spinner arc in the light accent
     #7C93FF on a 25% periwinkle track, hint in #9DB1FF so the status line
     reads clearly but stays subordinate to the wordmark.

     The background lives on an inner card that clips at its own
     border-radius; the <body> stays transparent so the corners show the
     desktop. This works on both platforms: WebView2 renders transparent page
     pixels over the hosting window's background (transparent(true) → tao's
     DwmEnableBlurBehindWindow backdrop). Windows disables the
     undecorated-window shadow in windows.rs create_splash (DWM would paint
     it as a 1px gray border); macOS keeps its native NSWindow shadow. A
     background on <body> would NOT work: like WKWebView, WebView2 propagates
     a root-element background over the whole rectangular canvas, ignoring
     border-radius.

     Fonts (DM Sans 400/500 for the wordmark and hint) are embedded as
     data: URLs — the page is served by the shell control service
     (ctl_server.rs include_str!) with no CSP, and it must render even when
     the sidecar/dsh (and their static assets) are down. -->

  html,body{height:100%;background:transparent}
  body{
    font-family:'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC','PingFang SC',sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;
  }
  .card{
    width:100%;height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:18px;
    background:radial-gradient(130% 125% at 50% 36%,#232c66 0%,#171e4a 55%,#0d1230 100%);
    box-shadow:inset 0 0 0 1px rgba(157,177,255,0.14); /* faint edge so the rounded card reads off the desktop */
    border-radius:12px;overflow:hidden;
  }
  .brand{display:flex;align-items:center;color:#4D6BFE}
  .brand svg{display:block}
  .brand-pill{
    display:inline-flex;padding:1px;border-radius:14px;
    background:linear-gradient(135deg,#aabdfe 0%,#dbe5ff 38%,#e6edff 62%,#c3d1ff 100%);
    box-shadow:0 0 0 1px rgba(157,177,255,0.4),0 4px 18px rgba(46,66,212,0.55);
  }
  .brand-pill .brand-inner{
    display:flex;align-items:center;gap:4px;padding:7px 11px;border-radius:12px;background:#fff;
  }
  .brand-pill .brand-label{
    color:#4D6BFE; /* primary whale blue from assets/icon-source.svg */
    font-family:'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC','PingFang SC',sans-serif;
    font-size:15px;font-weight:700;line-height:15px;white-space:nowrap;
  }
  .spinner{width:20px;height:20px;border-radius:50%;border:2px solid rgba(157,177,255,0.25);border-top-color:#7C93FF;animation:spin .8s linear infinite}
  .hint{font-size:14px;line-height:20px;color:#9DB1FF}
  @keyframes spin{to{transform:rotate(360deg)}}
