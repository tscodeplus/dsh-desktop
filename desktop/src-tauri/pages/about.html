<!DOCTYPE html>
<!-- Frameless About dialog. Served by the shell's control service
     (http://127.0.0.1:{ctlPort}/pages/about.html). Runtime data is injected
     by the shell as window.__DSHD_ABOUT__ (JSON) and rendered with
     textContent (no HTML injection surface). Buttons talk to the shell
     control service (same origin) and the sidecar control API (cross-origin,
     CORS-enabled) with Bearer tokens. -->
<html><head><meta charset="utf-8">
<style>
  :root { --bg:#fafafc; --fg:#1e2430; --muted:#667085; --border:#e6e8ee;
          --btn:#3b5bdb; --btn-hover:#364fc7; --btn-text:#fff;
          --chip-bg:#eef1f6; --link:#3b5bdb; }
  body[data-theme="dark"] { --bg:#14141f; --fg:#e6e6f0; --muted:#a6adc0;
          --border:#2a2b3d; --btn:#4f8cff; --btn-hover:#6b9cff;
          --chip-bg:#22233a; --link:#7aa2ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
         background:var(--bg); color:var(--fg); height:100vh;
         display:flex; flex-direction:column; user-select:none;
         -webkit-user-select:none; }
  .header { display:flex; align-items:center; gap:12px;
            padding:18px 22px 14px; border-bottom:1px solid var(--border); }
  .header .logo { width:36px; height:36px; border-radius:8px; flex:none; }
  .header h1 { font-size:15px; font-weight:600; }
  .header .sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .body { flex:1; padding:16px 22px; overflow-y:auto; }
  .row { display:flex; align-items:center; gap:10px; padding:7px 0;
         font-size:13px; }
  .row .label { color:var(--muted); width:118px; flex:none; }
  .row .value { font-weight:500; word-break:break-all; }
  .row a { color:var(--link); text-decoration:none; }
  .row a:hover { text-decoration:underline; }
  .chip { display:inline-block; padding:2px 8px; border-radius:10px;
          background:var(--chip-bg); font-size:11px; color:var(--muted);
          margin-left:6px; vertical-align:1px; }
  .bar { height:6px; background:var(--border); border-radius:3px;
         overflow:hidden; width:160px; flex:none; }
  .bar > div { height:100%; background:var(--btn); width:0; }
  /* Indeterminate bar — while installing when extraction progress is
     unmeasurable (pre-scan failed). */
  .bar.indeterminate > div { width:30%; animation:bar-slide 1.2s ease-in-out infinite; }
  @keyframes bar-slide { 0% { transform:translateX(-120%); } 100% { transform:translateX(420%); } }
  .engine-status { display:flex; flex-direction:column; gap:4px;
                   align-items:flex-start; flex:1; min-width:0; }
  .engine-status .line { display:flex; align-items:center; gap:8px;
                         font-size:12px; flex-wrap:wrap; }
  /* Inline engine-update flow: the status rows carry no label column (the
     "发现 DeepSeek Harness 新版本 …" line stands alone), action links render
     as small buttons pinned to the right edge of their row, and the download
     progress bar sits on its own row aligned with the version text. */
  #engine-status-row .label { display:none; }
  .engine-status .mini-btn { display:inline-flex; align-items:center;
          padding:3px 12px; border-radius:6px; background:var(--btn);
          color:var(--btn-text); font-size:12px; font-weight:600;
          text-decoration:none; margin-left:auto; }
  .engine-status .mini-btn:hover { background:var(--btn-hover); }
  .engine-status .mini-btn.ghost { background:var(--chip-bg); color:var(--fg); }
  .engine-status .mini-btn.ghost:hover { background:var(--border); }
  /* "Check for updates" next to the engine version becomes a small button. */
  #lnk-engine-check { display:inline-block; margin-left:10px; padding:3px 12px;
          border-radius:6px; background:var(--btn); color:var(--btn-text);
          font-size:12px; font-weight:600; text-decoration:none; }
  #lnk-engine-check:hover { background:var(--btn-hover); }
  .footer { display:flex; gap:10px; padding:14px 22px 18px;
            border-top:1px solid var(--border); }
  button { flex:1; padding:8px 10px; border:none; border-radius:8px;
           font-size:13px; font-weight:600; cursor:pointer;
           background:var(--btn); color:var(--btn-text); }
  button:hover { background:var(--btn-hover); }
  button.secondary { background:var(--chip-bg); color:var(--fg); }
  button.secondary:hover { background:var(--border); }
</style></head><body>
<div class="header">
  <img id="app-icon" class="logo" alt="" style="display:none">

      <path style="fill:#B0D3FF;" d="M60.9,74.83c0.7,2.82-16.05,2.67-30.13,0.14S6.13,66.81,6.13,66.81c-0.02,0.23-1.47-3.34-1.55-5.91c-0.06-2.05,0.7-3.63,0.7-3.63s4.82,4.12,12.71,6.93c7.88,2.82,17.13,6.02,24.74,7.11C55.55,73.14,60.41,72.88,60.9,74.83z"/>
      <ellipse transform="matrix(0.9883 -0.1525 0.1525 0.9883 -10.004 10.3307)" style="fill:#2C292A;" cx="62.33" cy="70.37" rx="3.52" ry="3.33"/>
      <path style="fill:#51C7FF;" d="M117.77,80.82c0,0-5.35,5.7-17.74,5.56c-8.36-0.1-21.4-1.55-21.4-1.55s4.5,2.11,7.04,4.93c2.53,2.82,5.95,9.57,5.95,9.57s11.68-3.34,17.18-7.99C114.29,86.69,117.77,80.82,117.77,80.82z"/>
      <path style="fill:#B0D3FF;" d="M9.41,71.74c0,0,11.09,6.9,21.79,8.87s20.41,3.1,26.19,3.38s11.4,0.14,11.4,0.14s7.18,10.98,9.01,14.08c1.83,3.1,5.35,9.71,9.29,11.26c3.94,1.55,7.5,1.13,7.5,1.13s-5.21,3.94-11.16-0.14c-2.55-1.75-8.55-9.08-8.55-9.08s-7.32-0.07-11.83-0.53c-4.21-0.43-8.9-1.37-8.9-1.37s-0.27,4.59,0.07,6.97c0.35,2.46,2.04,6.81,5.91,7.74c0.88,0.21,1.96,0.17,1.9,0.28c-0.46,0.92-4.46,2.6-8.17-1.06c-4.82-4.76-3.8-14.43-3.8-14.43s-6.83-1.47-14.92-6.41c-4.61-2.82-14.04-8.73-18.37-12.85C13.35,76.48,9.41,71.74,9.41,71.74z"/>
      <path style="fill:#B0D3FF;" d="M54.63,86.87c3.12,0.82,7.21-0.28,7.25,0.49c0.07,1.34-4.56,1.86-7.53,1.48c-3.8-0.49-6.37-3.17-6.34-4.01C48.09,83.28,50.76,85.85,54.63,86.87z"/>

      <path style="fill:#B0D3FF;" d="M25,81.45c-0.69,0.15,0.53,3.41,4.89,5.88s7.92,2.93,9.82,4.05c2.75,1.62,3.26,4.51,7.6,6.19c5.63,2.18,10.28,0.7,14.08,0.63c3.8-0.07,10.14,1.62,10.35,0.63c0.27-1.26-6.05-2.67-10.56-2.75c-3.1-0.05-6.69,1.41-11.83,0.07c-5.14-1.34-5.07-4.58-9.08-6.69c-3.23-1.7-6.62-2.53-9.36-3.8C28.17,84.41,25.98,81.24,25,81.45z"/>
    </g>
  </svg>
  <div>
    <h1 id="app-name">DSH Desktop</h1>
    <div class="sub" id="app-sub"></div>
  </div>
</div>
<div class="body">
  <div class="row">
    <span class="label" id="lbl-ver"></span>
    <span class="value" id="val-ver"></span>
  </div>
  <div class="row">
    <span class="label" id="lbl-engine"></span>
    <span class="value">
      <span id="val-engine"></span>
      <a id="lnk-engine-check" href="#" style="font-size:12px"></a>
    </span>
  </div>
  <div class="row">
    <span class="label" id="lbl-commit"></span>
    <span class="value"><a id="lnk-commit"></a></span>
  </div>
  <div class="row" id="engine-status-row" style="display:none">
    <span class="label" id="lbl-engine-status"></span>
    <span class="value engine-status" id="engine-status-value"></span>
  </div>
</div>
<div class="footer">
  <button class="secondary" id="btn-open-logs"></button>
  <button class="secondary" id="btn-close"></button>
  <button id="btn-check"></button>
</div>
<script>
  (function () {
    var a = window.__DSHD_ABOUT__ || {};
    var L = a.labels || {};
    function set(id, text) {
      var el = document.getElementById(id);
      if (el) el.textContent = text;
    }
    if (a.dark) document.body.setAttribute('data-theme', 'dark');

    if (a.icon) {
      var img = document.getElementById('app-icon');
      img.src = a.icon;
      img.style.display = 'block';
      document.getElementById('app-icon-fallback').style.display = 'none';
    }
    set('app-name', L.appName || 'DSH Desktop');
    set('app-sub', a.version ? ('v' + a.version) : '');
    set('lbl-ver', L.desktopVersionLabel || 'Desktop version');
    set('val-ver', a.version || '-');
    set('lbl-commit', L.upstreamCommitLabel || 'GitHub commit');

    var commitEl = document.getElementById('lnk-commit');
    if (a.upstreamCommit) {
      commitEl.textContent = a.upstreamCommit.slice(0, 12);
      commitEl.href = (L.dshRepo || 'https://github.com/deepseek-ai/deepseek-harness') +
        '/tree/' + a.upstreamCommit;
      // Tauri WebViews block target=_blank popups, so open the commit in the
      // system browser through the shell control service (same endpoint the
      // updater's "GitHub Release" button uses).
      commitEl.addEventListener('click', function (e) {
        e.preventDefault();
        var url = commitEl.href;
        if (a.ctlPort && url) {
          post('http://127.0.0.1:' + a.ctlPort + '/open-external', a.ctlToken, { url: url });
        }
      });
    } else {
      commitEl.textContent = '-';
    }

    function post(url, token, body) {
      return fetch(url, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + (token || ''),
          'Content-Type': 'application/json'
        },
        body: body ? JSON.stringify(body) : '{}'
      });
    }

    document.getElementById('btn-check').textContent = L.checkUpdates || 'Check for Updates';
    document.getElementById('btn-open-logs').textContent = L.openLogs || 'Open Log Folder';
    document.getElementById('btn-close').textContent = L.close || 'Close';

    document.getElementById('btn-check').onclick = function () {
      var port = a.sidecarPort;
      if (!port) return;
      post('http://127.0.0.1:' + port + '/_desktop/updater/check', a.sidecarToken,
           { includeBeta: false, fromTray: true }).catch(function () {});
    };

    // Engine (upstream DeepSeek Harness) version — refreshed at runtime from
    // the sidecar control API so engine updates show here without a desktop
    // release. The injected (compile-time) values are the fallback.
    set('lbl-engine', L.engineLabel || 'DeepSeek Harness');
    set('lbl-engine-status', L.engineLabel || 'DeepSeek Harness');

    // Inline update flow (same pattern as OhMyAgent's Settings > About): the
    // check button drives check/download/install inline in this window by
    // polling /_desktop/engine/status — no separate popup.
    var engRow = document.getElementById('engine-status-row');
    var engVal = document.getElementById('engine-status-value');
    var engPoll = null;
    var engHideTimer = null;

    function engEsc(s) {
      var d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
    function engLink(label, id, style) {
      var cls = style === 'primary' ? ' class="mini-btn"' :
                style === 'ghost' ? ' class="mini-btn ghost"' : '';
      return '<a href="#" id="' + id + '"' + cls + '>' + engEsc(label) + '</a>';
    }
    function fmtMB(n) { return (n / 1048576).toFixed(1) + ' MB'; }
    function postEngine(action) {
      var port = a.sidecarPort;
      if (!port) return;
      post('http://127.0.0.1:' + port + '/_desktop/engine/' + action, a.sidecarToken,
           {}).catch(function () {});
    }
    function engPollStart() {
      if (engPoll) return;
      engPoll = setInterval(function () {
        var port = a.sidecarPort;
        if (!port) return;
        fetch('http://127.0.0.1:' + port + '/_desktop/engine/status?token=' +
              encodeURIComponent(a.sidecarToken || ''))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (s) { if (s) renderEngineStatus(s); })
          .catch(function () {});
      }, 1000);
    }
    function engPollStop() {
      if (engPoll) { clearInterval(engPoll); engPoll = null; }
    }
    function engShow(parts, hideAfterMs) {
      // Each part renders as its own row — the version text, the progress
      // bar, and the action buttons never share a line.
      engVal.innerHTML = parts.map(function (p) {
        return '<div class="line">' + p + '</div>';
      }).join('');
      engRow.style.display = '';
      if (hideAfterMs) {
        engHideTimer = setTimeout(function () { engRow.style.display = 'none'; }, hideAfterMs);
      } else if (engHideTimer) {
        clearTimeout(engHideTimer);
        engHideTimer = null;
      }
    }
    function engHide() {
      engRow.style.display = 'none';
      engPollStop();
      if (engHideTimer) { clearTimeout(engHideTimer); engHideTimer = null; }
    }

    // Action buttons are created dynamically — delegate on the container.
    engVal.addEventListener('click', function (e) {
      var id = (e.target && e.target.id) || '';
      if (id === 'eng-download-install') postEngine('download-install');
      else if (id === 'eng-install') postEngine('install');
      else if (id === 'eng-restart') postEngine('restart');
      else if (id === 'eng-later') engHide();
      else if (id === 'eng-cancel') postEngine('cancel');
      else if (id === 'eng-recheck') { postEngine('check'); engPollStart(); }
      e.preventDefault();
    });

    function renderEngineStatus(s) {
      var cur = s.current || {};
      var check = s.check || {}, dl = s.download || {}, ins = s.install || {};
      var lines = [];
      if (ins.state === 'done') {
        // Engine swapped — refresh the version row too.
        var v = ins.message || cur.upstreamVersion || (cur.ref ? cur.ref.slice(0, 12) : '');
        if (cur.upstreamVersion) set('val-engine', cur.upstreamVersion);
        if (cur.ref) {
          var ce = document.getElementById('lnk-commit');
          ce.textContent = cur.ref.slice(0, 12);
          ce.href = (L.dshRepo || 'https://github.com/deepseek-ai/deepseek-harness') + '/tree/' + cur.ref;
        }
        lines.push(engEsc((L.engineInstalled || 'DeepSeek Harness updated to {{version}}')
          .replace('{{version}}', v || '-')));
        // Static confirmation — never auto-hides or flashes away (the engine
        // restarted, so stop polling; the status would otherwise go idle and
        // the polling render would clear this line).
        engPollStop();
        engShow(lines, 0);
        return;
      }
      if (s.state === 'ready' || ins.state === 'ready') {
        // Staged update awaits the user's go — the engine keeps running
        // until they confirm (auto-restart would interrupt running tasks).
        lines.push(engEsc(L.engineInstallReady || 'Update ready — restart to apply') +
                   engLink(L.engineRestartNow || 'Restart Now', 'eng-restart', 'primary') +
                   engLink(L.engineLater || 'Later', 'eng-later', 'ghost'));
      } else if (s.state === 'checking') {
        lines.push(engEsc(L.engineChecking || 'Checking for updates…'));
      } else if (s.state === 'downloading' ||
                 (s.state === 'available' && dl.state === 'downloading')) {
        // Row 1: the version announcement (same text as the available state);
        // row 2: the progress bar, aligned with it.
        var av = s.available || {};
        lines.push(engEsc((L.engineAvailable || 'Update available') + ' ' +
                          (av.version || '') + ' (' + fmtMB(av.size || 0) + ')'));
        var pct = Math.round((dl.progress && dl.progress.percent) || 0);
        lines.push('<span class="bar"><div style="width:' + pct + '%"></div></span>' +
                   '<span>' + pct + '%</span>' +
                   engLink(L.engineCancel || 'Cancel', 'eng-cancel', 'ghost'));
      } else if (s.state === 'available' && dl.state === 'done') {
        lines.push(engEsc(L.engineDownloaded || 'Downloaded, ready to install') +
                   engLink(L.engineInstallNow || 'Install', 'eng-install', 'primary'));
      } else if (s.state === 'available') {
        var av = s.available || {};
        lines.push(engEsc((L.engineAvailable || 'Update available') + ' ' +
                          (av.version || '') + ' (' + fmtMB(av.size || 0) + ')') +
                   engLink(L.engineDownload || 'Download & Install', 'eng-download-install', 'primary'));
      } else if (s.state === 'installing' || ins.state === 'installing') {
        // restartUpdate sets ins.message ("Restarting…") — show it over the
        // generic label; it carries no progress, so the bar below is
        // indeterminate during the swap instead of a fake percentage.
        lines.push(engEsc(ins.message || L.engineInstalling || 'Installing…'));
        if (typeof ins.progress === 'number' && ins.progress >= 0) {
          var ipct = Math.min(100, Math.round(ins.progress));
          lines.push('<span class="bar"><div style="width:' + ipct + '%"></div></span>' +
                     '<span>' + ipct + '%</span>');
        } else {
          lines.push('<span class="bar indeterminate"><div></div></span>');
        }
      } else if (s.state === 'error') {
        // Report the actual failing step: a download failure is not an
        // install failure, and a rolled-back install has its own message.
        var msg = (dl.state === 'error' ? (dl.message || dl.raw) : '') ||
                  (ins.state === 'error' ? ins.message : '') ||
                  L.engineInstallFailed || 'Install failed';
        lines.push(engEsc(msg) +
                   engLink(L.engineCheckAgain || 'Check Again', 'eng-recheck', 'ghost'));
      } else if (check.state === 'done' && check.result === 'uptodate') {
        lines.push(engEsc(L.engineUpToDate || 'Up to date'));
        engShow(lines, 5000);
        return;
      } else if (check.state === 'done' && check.result === 'none') {
        engHide();
        return;
      } else {
        engHide();
        return;
      }
      engShow(lines, 0);
    }

    var engineCheckEl = document.getElementById('lnk-engine-check');
    engineCheckEl.textContent = L.checkEngineUpdates || 'Check for updates';
    engineCheckEl.onclick = function (e) {
      e.preventDefault();
      var port = a.sidecarPort;
      if (!port) return;
      postEngine('check');
      // Show the checking state immediately, then poll the sidecar.
      engShow([engEsc(L.engineChecking || 'Checking for updates…')], 0);
      engPollStart();
    };

    (function refreshEngineStatus() {
      var port = a.sidecarPort;
      if (!port) return; // heartbeat not synced yet — keep compile-time values
      fetch('http://127.0.0.1:' + port + '/_desktop/engine/status?token=' + encodeURIComponent(a.sidecarToken || ''))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (s) {
          if (!s || !s.current || !s.current.ref) return; // silent fallback
          var cur = s.current;
          var upstream = cur.upstreamVersion || cur.tag || '';
          var commitEl = document.getElementById('lnk-commit');
          if (cur.ref) {
            commitEl.textContent = cur.ref.slice(0, 12);
            commitEl.href = (L.dshRepo || 'https://github.com/deepseek-ai/deepseek-harness') + '/tree/' + cur.ref;
          }
          set('val-engine', upstream || cur.ref.slice(0, 12) || '-');
          // If an engine operation is in flight (e.g. started from the
          // startup popup), show the inline status and follow it.
          if (s.state !== 'idle') {
            renderEngineStatus(s);
            engPollStart();
          }
        })
        .catch(function () { /* keep compile-time values */ });
    })();
    document.getElementById('btn-open-logs').onclick = function () {
      if (a.ctlPort) {
        post('http://127.0.0.1:' + a.ctlPort + '/open-log-dir', a.ctlToken);
      }
    };
    document.getElementById('btn-close').onclick = function () {
      if (a.ctlPort) {
        post('http://127.0.0.1:' + a.ctlPort + '/close-window', a.ctlToken,
             { kind: 'about' });
      } else {
        window.close();
      }
    };
  })();
</script>
