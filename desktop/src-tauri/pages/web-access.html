<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web 端访问</title>
<style>
  :root {
    --bg: #fafafc;
    --fg: #1c1c28;
    --muted: #8a8a99;
    --border: #e6e6ec;
    --chip-bg: #eef0f4;
    --btn: #4f46e5;
    --btn-text: #ffffff;
    --btn-hover: #4338ca;
    --url-bg: #f3f4f8;
  }
  [data-theme="dark"] {
    --bg: #14141f;
    --fg: #e8e8f0;
    --muted: #8b8b9a;
    --border: #2a2a3a;
    --chip-bg: #23232f;
    --btn: #6d63f0;
    --btn-text: #ffffff;
    --btn-hover: #8076ff;
    --url-bg: #1d1d2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 14px;
    flex: none;
  }
  /* Scrollable body with a THIN scrollbar that adapts to the theme. */
  .body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 18px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .body::-webkit-scrollbar { width: 6px; }
  .body::-webkit-scrollbar-track { background: transparent; }
  .body::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 6px;
  }
  .body::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .remote-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .remote-url {
    flex: 1 1 auto;
    min-width: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    word-break: break-all;
    background: var(--url-bg);
    padding: 6px 8px;
    border-radius: 6px;
  }
  .remote-copy {
    flex: none;
    margin: 0;
    padding: 4px 12px;
    border-radius: 6px;
    border: none;
    background: var(--chip-bg);
    color: var(--fg);
    font-size: 12px;
    cursor: pointer;
  }
  .remote-copy:hover { background: var(--border); }
  /* Top hint, directly under the title — a touch more prominent than body
     copy, but deliberately not bold or loud. */
  .remote-hint {
    color: var(--fg);
    opacity: 0.75;
    font-size: 12px;
    margin-bottom: 14px;
    line-height: 1.7;
  }
  .empty {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }
  /* Bind-adapter preference: segmented LAN/Tailscale + force-restart button. */
  .bind-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 4px;
    flex-wrap: wrap;
  }
  .bind-row .bind-caption { font-size: 12.5px; color: var(--fg); opacity: .85; }
  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-left: auto;
  }
  .seg button {
    border: 0;
    border-radius: 0;
    padding: 6px 16px;
    font-size: 12.5px;
    background: transparent;
    color: var(--fg);
    opacity: .6;
    cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on {
    background: #1f6feb;
    color: #fff;
    opacity: 1;
    font-weight: 600;
  }
  .seg button:disabled { opacity: .4; cursor: default; }
  #bind-hint {
    color: var(--fg);
    opacity: .75;
    font-size: 12px;
    margin-bottom: 10px;
    line-height: 1.7;
  }
  #bind-status {
    color: var(--muted);
    font-size: 12px;
    min-height: 16px;
    margin-bottom: 10px;
  }
  #remote-hint { margin-bottom: 10px; }
  .bind-block {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
  }
  .footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    flex: none;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  button.primary { background: var(--btn); color: var(--btn-text); }
  button.primary:hover { background: var(--btn-hover); }
  button.secondary { background: var(--chip-bg); color: var(--fg); }
  button.secondary:hover { background: var(--border); }
</style>
</head>
<body>
  <div class="header" id="hdr"></div>
  <div class="body">
    <div class="remote-hint" id="remote-hint"></div>
    <div class="bind-block">
      <div id="bind-hint"></div>
      <div class="bind-row">
        <span class="bind-caption" id="bind-label"></span>
        <div class="seg" id="bind-seg">
          <button type="button" id="seg-lan"></button>
          <button type="button" id="seg-ts"></button>
        </div>
      </div>
      <div id="bind-status"></div>
    </div>
    <div id="remote-list"></div>
  </div>
  <div class="footer">
    <button class="secondary" id="btn-close"></button>
  </div>
<script>
  (function () {
    var a = window.__DSHD_WEBACCESS__ || {};
    var L = a.labels || {};
    function set(id, text) {
      var el = document.getElementById(id);
      if (el) el.textContent = text;
    }
    function post(url, token, body) {
      return fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
        },
        body: body ? JSON.stringify(body) : '{}',
      });
    }
    if (a.dark) document.body.setAttribute('data-theme', 'dark');
    set('hdr', L.title || 'Web Access');
    set('remote-hint', L.remoteAccessHint ||
      'Open any of these URLs in a browser on another device on the same network / Tailscale to access the Web UI.');
    set('btn-close', L.close || 'Close');
    set('bind-hint', L.bindHint ||
      'The engine binds ONE interface. Picking an option saves it and restarts the service immediately.');
    set('bind-label', L.bindLabel || 'Bind Adapter');
    set('seg-lan', L.bindLan || 'LAN');
    set('seg-ts', L.bindTailnet || 'Tailscale');

    document.getElementById('btn-close').onclick = function () {
      if (a.ctlPort) {
        post('http://127.0.0.1:' + a.ctlPort + '/close-window', a.ctlToken,
             { kind: 'web-access' });
      } else {
        window.close();
      }
    };

    function renderList(list, emptyText) {
      // Desktop engines (0.2.1-alpha.5+) serve exactly ONE authority. A
      // multi-entry list only ever appears in the respawn gap (bind
      // authority unknown → the endpoint falls back to every interface,
      // virtual adapters included) — never render it; show the empty state
      // until the single real link is back.
      if (list && list.length > 1) list = [];
      var target = document.getElementById('remote-list');
      target.innerHTML = '';
      if (!list || !list.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = emptyText || '暂无可访问的远程地址（本机可能以回环方式绑定，或服务尚未就绪）。';
        target.appendChild(empty);
        return;
      }
      list.forEach(function (head) {
        var item = document.createElement('div');
        item.className = 'remote-item';
        var u = document.createElement('span');
        u.className = 'remote-url';
        u.textContent = head.url;
        var btn = document.createElement('button');
        btn.className = 'remote-copy';
        btn.type = 'button';
        btn.textContent = L.copy || 'Copy';
        btn.onclick = function () {
          var done = function () {
            btn.textContent = L.copied || 'Copied';
            setTimeout(function () { btn.textContent = L.copy || 'Copy'; }, 1500);
          };
          var fallback = function () {
            var ta = document.createElement('textarea');
            ta.value = head.url; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta); done();
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(head.url).then(done, fallback);
          } else { fallback(); }
        };
        item.appendChild(u);
        item.appendChild(btn);
        target.appendChild(item);
      });
    }
    function fetchEntries() {
      return fetch('http://127.0.0.1:' + port + '/_desktop/dsh-lan?token=' +
            encodeURIComponent(a.sidecarToken || ''))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (info) {
          return (info && info.addresses || []).map(function (addr) {
            return {
              url: 'http://' + addr + ':' + (info.port || port) + '/' +
                (info.token ? ('?token=' + encodeURIComponent(info.token)) : '')
            };
          });
        })
        .catch(function () { return null; });
    }
    function refreshList() {
      return fetchEntries().then(function (entries) {
        if (!entries) {
          renderList([], '加载失败，请重试。');
          return [];
        }
        renderList(entries);
        return entries;
      });
    }
    var port = a.sidecarPort;
    if (port) {
      void refreshList();
      // If the panel opened inside the respawn/startup gap (empty or
      // suppressed multi-entry list), keep checking until the single served
      // link is announced. Idle otherwise — one fetch per 3s for a minute.
      var initTries = 0;
      var initTimer = setInterval(function () {
        if (busy || initTries++ > 20) {
          clearInterval(initTimer);
          return;
        }
        void fetchEntries().then(function (entries) {
          if (entries && (entries.length === 1 || entries.length === 0)) {
            renderList(entries);
            if (entries.length === 1) clearInterval(initTimer);
          }
          // entries === null (fetch failed) or multi (gap): leave DOM as-is
        });
      }, 3000);
    }

    // ---- Bind-adapter preference (engine 0.2.1-alpha.5+ single-bind model).
    // Picking an option PUTs the preference and the sidecar RESPWNS dsh (its
    // spawn pre-flight re-runs the lan-bind migration). The panel polls the
    // dsh-lan endpoint until the respawned server answers, then re-renders
    // the list against the new bind/token. The tray menu's Restart re-applies
    // the binding after a network change without touching this setting.
    var segLan = document.getElementById('seg-lan');
    var segTs = document.getElementById('seg-ts');
    var busy = false;
    function setSelected(v) {
      segLan.className = v === 'lan' ? 'on' : '';
      segTs.className = v === 'tailscale' ? 'on' : '';
    }
    function setStatus(text) {
      var el = document.getElementById('bind-status');
      if (el) el.textContent = text || '';
    }
    function setBusy(on) {
      busy = on;
      segLan.disabled = on;
      segTs.disabled = on;
    }
    function currentAdapter() {
      return (segTs.className || '').indexOf('on') >= 0 ? 'tailscale' : 'lan';
    }
    function onPick(value) {
      if (busy) return;
      if (value === currentAdapter()) return; // already selected — no-op
      // Snapshot the CURRENT served links: the respawn takes seconds and the
      // old instance keeps answering until it is stopped, so "list non-empty"
      // is not enough — only accept the poll once the served list actually
      // differs from what was shown before the switch.
      var before = Array.from(document.querySelectorAll('#remote-list .remote-url'))
        .map(function (el) { return el.textContent; });
      setBusy(true);
      setStatus(L.retrying || 'Rebinding and restarting service…');
      fetch('http://127.0.0.1:' + port + '/_desktop/bind-adapter?token=' +
            encodeURIComponent(a.sidecarToken || ''), {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + (a.sidecarToken || ''),
        },
        body: JSON.stringify({ value: value }),
      })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error(String(r.status))); })
        .then(function (out) {
          if (!out || out.ok !== true) throw new Error('bad response');
          if (out.changed === false) {
            // Nobody raced us — just reflect the stored value.
            setSelected(out.bindAdapter === 'tailscale' ? 'tailscale' : 'lan');
            setStatus(L.bindAlready || 'Already the current selection');
            setBusy(false);
            return;
          }
          setSelected(value);
          // Poll until the respawned server announces a launch URL again.
          // Accept only when the served list CHANGED vs the pre-switch
          // snapshot AND is a single link (the stop window lists every
          // interface, and the old instance's list matches the snapshot —
          // neither may be taken as "the new bind is live").
          var tries = 0;
          var timer = setInterval(function () {
            if (tries++ > 30) {
              clearInterval(timer);
              setStatus('');
              setBusy(false);
              return;
            }
            void refreshList().then(function () {
              // The pre-switch list stays in the DOM through the gap (multi
              // entries are suppressed in renderList), so "changed" can be
              // read straight off what is rendered.
              var now = Array.from(document.querySelectorAll('#remote-list .remote-url'))
                .map(function (el) { return el.textContent; });
              var changed = now.length === 1 &&
                (before.length !== 1 || now[0] !== before[0]);
              if (changed) {
                clearInterval(timer);
                setStatus(L.bindSaved || 'Saved');
                setTimeout(function () { if (!busy) setStatus(''); }, 2000);
                setBusy(false);
              }
            });
          }, 2000);
        })
        .catch(function () {
          setStatus(L.bindFailed || 'Operation failed, try again later');
          setBusy(false);
        });
    }
    segLan.onclick = function () { onPick('lan'); };
    segTs.onclick = function () { onPick('tailscale'); };
    // Seed the current choice from the persisted config (the sidecar owns it;
    // if the read fails, the default 'lan' just shows as selected).
    if (port) {
      fetch('http://127.0.0.1:' + port + '/_desktop/config?key=bindAdapter&token=' +
            encodeURIComponent(a.sidecarToken || ''))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (out) {
          if (out && out.value === 'tailscale') setSelected('tailscale');
          else setSelected('lan');
        })
        .catch(function () { setSelected('lan'); });
    }
  })();
</script>
</body></html>
