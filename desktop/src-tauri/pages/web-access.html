<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web 端访问</title>
<style>
  :root {
    --bg: #fafafc;
    --fg: #1c1c28;
    --muted: #8a8a99;
    --border: #e6e6ec;
    --chip-bg: #eef0f4;
    --btn: #4f46e5;
    --btn-text: #ffffff;
    --btn-hover: #4338ca;
    --url-bg: #f3f4f8;
  }
  [data-theme="dark"] {
    --bg: #14141f;
    --fg: #e8e8f0;
    --muted: #8b8b9a;
    --border: #2a2a3a;
    --chip-bg: #23232f;
    --btn: #6d63f0;
    --btn-text: #ffffff;
    --btn-hover: #8076ff;
    --url-bg: #1d1d2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 14px;
    flex: none;
  }
  /* Scrollable body with a THIN scrollbar that adapts to the theme. */
  .body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 18px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .body::-webkit-scrollbar { width: 6px; }
  .body::-webkit-scrollbar-track { background: transparent; }
  .body::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 6px;
  }
  .body::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .remote-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .remote-url {
    flex: 1 1 auto;
    min-width: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    word-break: break-all;
    background: var(--url-bg);
    padding: 6px 8px;
    border-radius: 6px;
  }
  .remote-copy {
    flex: none;
    margin: 0;
    padding: 4px 12px;
    border-radius: 6px;
    border: none;
    background: var(--chip-bg);
    color: var(--fg);
    font-size: 12px;
    cursor: pointer;
  }
  .remote-copy:hover { background: var(--border); }
  .remote-hint {
    color: var(--muted);
    font-size: 11px;
    margin-top: 6px;
    line-height: 1.6;
  }
  .empty {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }
  .footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    flex: none;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  button.primary { background: var(--btn); color: var(--btn-text); }
  button.primary:hover { background: var(--btn-hover); }
  button.secondary { background: var(--chip-bg); color: var(--fg); }
  button.secondary:hover { background: var(--border); }
</style>
</head>
<body>
  <div class="header" id="hdr"></div>
  <div class="body">
    <div id="remote-list"></div>
    <div class="remote-hint" id="remote-hint"></div>
  </div>
  <div class="footer">
    <button class="secondary" id="btn-close"></button>
  </div>
<script>
  (function () {
    var a = window.__DSHD_WEBACCESS__ || {};
    var L = a.labels || {};
    function set(id, text) {
      var el = document.getElementById(id);
      if (el) el.textContent = text;
    }
    function post(url, token, body) {
      return fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
        },
        body: body ? JSON.stringify(body) : '{}',
      });
    }
    if (a.dark) document.body.setAttribute('data-theme', 'dark');
    set('hdr', L.title || 'Web Access');
    set('btn-close', L.close || 'Close');

    document.getElementById('btn-close').onclick = function () {
      if (a.ctlPort) {
        post('http://127.0.0.1:' + a.ctlPort + '/close-window', a.ctlToken,
             { kind: 'web-access' });
      } else {
        window.close();
      }
    };

    // List one `?token=` launch URL per reachable LAN address (incl. Tailscale
    // 100.x) so another device can open the Web UI. The token comes from the
    // sidecar (same source the engine status uses); pre-token engines list
    // plain URLs.
    var port = a.sidecarPort;
    if (!port) return;
    fetch('http://127.0.0.1:' + port + '/_desktop/dsh-lan?token=' +
          encodeURIComponent(a.sidecarToken || ''))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (info) {
        set('remote-hint', L.remoteAccessHint ||
          'Open any of these URLs in a browser on another device on the same network / Tailscale to access the Web UI.');
        if (!info || !info.addresses || !info.addresses.length) {
          var empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = '暂无可用地址，请稍候重试。';
          document.getElementById('remote-list').appendChild(empty);
          return;
        }
        var list = document.getElementById('remote-list');
        info.addresses.forEach(function (addr) {
          var url = 'http://' + addr + ':' + info.port + '/' +
            (info.token ? ('?token=' + encodeURIComponent(info.token)) : '');
          var item = document.createElement('div');
          item.className = 'remote-item';
          var u = document.createElement('span');
          u.className = 'remote-url';
          u.textContent = url;
          var btn = document.createElement('button');
          btn.className = 'remote-copy';
          btn.type = 'button';
          btn.textContent = L.copy || 'Copy';
          btn.onclick = function () {
            var done = function () {
              btn.textContent = L.copied || 'Copied';
              setTimeout(function () { btn.textContent = L.copy || 'Copy'; }, 1500);
            };
            var fallback = function () {
              var ta = document.createElement('textarea');
              ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
              document.body.appendChild(ta); ta.select();
              try { document.execCommand('copy'); } catch (e) {}
              document.body.removeChild(ta); done();
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(url).then(done, fallback);
            } else { fallback(); }
          };
          item.appendChild(u);
          item.appendChild(btn);
          list.appendChild(item);
        });
      })
      .catch(function () {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '加载失败，请重试。';
        document.getElementById('remote-list').appendChild(empty);
      });
  })();
</script>
</body></html>
