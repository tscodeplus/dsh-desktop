name: Check Upstream

# Dependency-following watcher (single-mode git-follow — see
# Mydocs/IMPLEMENTATION_PLAN.md §5, §12.1): periodically compares the dsh
# upstream repo against desktop/dsh-ref.json and opens a PR that bumps the
# pinned ref when a new tag (preferred) or master commit appears.

on:
  schedule:
    # Daily at 02:00 UTC.
    - cron: '0 2 * * *'
  workflow_dispatch:
  # A bump PR is redundant the moment its ref lands on master (manual bump,
  # a merge, or another commit). Sweep and close it immediately instead of
  # waiting up to 24h for the next daily cron. Scoped to dsh-ref.json so a
  # normal master push doesn't re-run the whole upstream check.
  push:
    branches: [master]
    paths: ['desktop/dsh-ref.json']

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check upstream refs
        id: check
        run: |
          set -euo pipefail
          REF_DOC="$(cat desktop/dsh-ref.json)"
          CURRENT_REF="$(node -p "JSON.parse(process.argv[1]).ref" "$REF_DOC")"
          echo "current ref: ${CURRENT_REF}"

          # Newest dsh-v tag (if any) and master HEAD. The tag pattern is
          # explicit — a foreign line (e.g. a plain v1.0.0) sorts after
          # dsh-v0.1.0-rc.* under sort -V and would be followed instead.
          NEWEST_TAG="$(git ls-remote --tags --refs https://github.com/deepseek-ai/deepseek-harness.git 'refs/tags/dsh-v*' \
            | awk -F/ '{print $NF}' | sort -V | tail -1 || true)"
          MASTER_HEAD="$(git ls-remote https://github.com/deepseek-ai/deepseek-harness.git refs/heads/master \
            | awk '{print $1}')"
          echo "newest upstream tag: ${NEWEST_TAG:-<none>}"
          echo "master HEAD: ${MASTER_HEAD}"

          # Resolve the newest tag to its commit (preferred follow target).
          TAG_COMMIT=""
          if [ -n "${NEWEST_TAG}" ]; then
            TAG_COMMIT="$(git ls-remote https://github.com/deepseek-ai/deepseek-harness.git "refs/tags/${NEWEST_TAG}" \
              | awk '{print $1}' || true)"
          fi

          if [ -n "${TAG_COMMIT}" ] && [ "${TAG_COMMIT}" != "${CURRENT_REF}" ]; then
            echo "new tag found: ${NEWEST_TAG} (${TAG_COMMIT})"
            echo "target_ref=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"
            echo "tag=${NEWEST_TAG}" >> "$GITHUB_OUTPUT"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "note=跟随发版 tag ${NEWEST_TAG}" >> "$GITHUB_OUTPUT"
          elif [ "${MASTER_HEAD}" != "${CURRENT_REF}" ]; then
            echo "new master commit found: ${MASTER_HEAD}"
            echo "target_ref=${MASTER_HEAD}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "mode=commit" >> "$GITHUB_OUTPUT"
            echo "note=上游 ${MASTER_HEAD:0:12} 无新 tag；由 check-upstream 自动跟随 master。发版 tag 出现后切回 release 模式。" >> "$GITHUB_OUTPUT"
          else
            echo "upstream unchanged"
            echo "target_ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Close redundant bump PRs
        # By design, upstream updates reach installed apps through the engine
        # channel (engine-updater swaps the published closure at runtime) —
        # the desktop app is NOT rebuilt for upstream changes. A bump PR is
        # therefore redundant as soon as any of these holds:
        # 1. Landed — its ref is already recorded in dsh-ref.json on master.
        # 2. Published — the engine closure for its ref is already on the
        #    engine release (the channel carries the update; nothing to do).
        # 3. Superseded — this run is about to propose a NEWER ref (target_ref
        #    non-empty) and the PR follows an older upstream state.
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ steps.check.outputs.target_ref }}
        run: |
          set -euo pipefail
          CURRENT="$(node -p "JSON.parse(require('fs').readFileSync('desktop/dsh-ref.json','utf8')).ref.slice(0,12)")"
          TARGET="${TARGET_REF:0:12}"
          MANIFEST="$(curl -sfL "https://github.com/${GITHUB_REPOSITORY}/releases/download/engine/engine-manifest.json" || true)"
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | test("^chore/dsh-bump-")) | [.number, .headRefName] | @tsv' |
            while IFS=$'\t' read -r num head; do
              ref="${head#chore/dsh-bump-}"
              if [ "${ref}" = "${CURRENT}" ]; then
                echo "closing PR #${num} — bump for ${ref} is already on master"
                gh pr close "${num}" --comment \
                  "自动化关闭（check-upstream）：该 bump 的 ref（${ref}）已包含在 master 的 dsh-ref.json 中，无需合并。" \
                  || true
              elif [ -n "${MANIFEST}" ] && node -e '
                const m = JSON.parse(process.argv[1]);
                const refs = Object.values(m.platforms || {}).map((p) => p.ref);
                process.exit(refs.some((r) => r.startsWith(process.argv[2])) ? 0 : 1);
              ' "${MANIFEST}" "${ref}"; then
                echo "closing PR #${num} — engine closure for ${ref} is already published"
                gh pr close "${num}" --comment \
                  "自动化关闭（check-upstream）：ref ${ref} 的引擎闭包已发布到 engine channel，桌面端经 engine-updater 自动换入更新，无需 bump PR（上游更新不重新构建桌面端）。" \
                  || true
              elif [ -n "${TARGET}" ] && [ "${ref}" != "${TARGET}" ]; then
                echo "closing PR #${num} — bump for ${ref} is superseded (target: ${TARGET}, master: ${CURRENT})"
                gh pr close "${num}" --comment \
                  "自动化关闭（check-upstream）：该 bump 的 ref（${ref}）已被更新的上游状态取代（目标：${TARGET}）。请以最新的 bump PR 为准。" \
                  || true
              else
                echo "keeping PR #${num} — live proposal for ${ref}, closure not yet published"
              fi
            done

      - name: Open or update bump PR
        if: steps.check.outputs.target_ref != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ steps.check.outputs.target_ref }}
          TAG: ${{ steps.check.outputs.tag }}
          MODE: ${{ steps.check.outputs.mode }}
          NOTE: ${{ steps.check.outputs.note }}
        run: |
          set -euo pipefail
          # Engine channel first: if the closure for TARGET_REF is already
          # published, the update reaches installed apps via engine-updater
          # without rebuilding the desktop app — a bump PR has nothing left
          # to accomplish, so skip instead of opening a dead-letter PR.
          MANIFEST="$(curl -sfL "https://github.com/${GITHUB_REPOSITORY}/releases/download/engine/engine-manifest.json" || true)"
          if [ -n "${MANIFEST}" ] && node -e '
            const m = JSON.parse(process.argv[1]);
            const ref = process.argv[2];
            const refs = Object.values(m.platforms || {}).map((p) => p.ref);
            process.exit(refs.length > 0 && refs.every((r) => r === ref) ? 0 : 1);
          ' "${MANIFEST}" "${TARGET_REF}"; then
            echo "engine closure for ${TARGET_REF} is already published — skipping bump PR"
            exit 0
          fi
          BRANCH="chore/dsh-bump-${TARGET_REF:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          node -e '
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync("desktop/dsh-ref.json", "utf8"));
            doc.ref = process.env.TARGET_REF;
            doc.tag = process.env.TAG || null;
            doc.mode = process.env.MODE;
            doc.note = process.env.NOTE;
            doc.updatedBy = "check-upstream";
            // Version derived from the upstream tag (dsh-v0.1.0-rc.8 ->
            // 0.1.0-rc.8, same rule as fetch-dsh.cjs); null when following a
            // commit with no tag. Keeping it stale made bot PRs regress the
            // field (e.g. rc.8 -> rc.6) and never be merge-ready.
            doc.upstreamVersion = process.env.TAG
              ? process.env.TAG.replace(/^dsh-v/i, "")
              : null;
            fs.writeFileSync("desktop/dsh-ref.json", JSON.stringify(doc, null, 2) + "\n");
          '
          git add desktop/dsh-ref.json
          git commit -m "chore: bump dsh ref to ${TARGET_REF:0:12} ($MODE)"
          # Force: this branch exists only to carry this bump PR (name = the
          # target ref). A previous run may have pushed it already — a plain
          # push would fail on the non-fast-forward.
          git push -f origin "$BRANCH" 2>&1 | tail -3
          # Idempotent: an existing PR for this branch is fine (its head is
          # already pushed with the new ref).
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore: bump dsh ref to ${TARGET_REF:0:12}" \
            --body "上游变更（mode: $MODE${TAG:+，tag: $TAG}）。合并后 CI 将按新 ref 构建 + 冒烟；失败则回滚 ref（last-known-good）。" \
            || gh pr view "$BRANCH" --json number --jq '"PR already exists: #\(.number)"'
