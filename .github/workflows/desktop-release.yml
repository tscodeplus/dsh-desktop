name: Desktop Release

# Single-workflow release pipeline: a tag push runs the build matrix
# (Windows NSIS + macOS x64/arm64 dmg) and create-release runs only AFTER
# all builds finish, attaching every installer in one `gh release create`
# call. workflow_dispatch builds the matrix without creating a release
# (artifact-only, for validating a commit before tagging).
#
# Dependency following: `desktop/scripts/fetch-dsh.cjs` builds dsh from git
# at the ref pinned in `desktop/dsh-ref.json` (single-mode git-follow — see
# Mydocs/IMPLEMENTATION_PLAN.md §5). tauri build's beforeBuildCommand runs
# fetch:dsh → bundle-deps → build:sidecar; fetch:dsh fast-paths to a no-op
# when the closure for the pinned ref is already cached.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Detect release type (prerelease vs stable) from tag name
  # ------------------------------------------------------------------
  detect-release-type:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release_type.outputs.prerelease }}
    steps:
      - name: Detect release type
        id: release_type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref_name }}" =~ -(beta|rc|alpha|pre) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  # ------------------------------------------------------------------
  # Build — one job per target, in parallel. Native modules (node-pty /
  # koffi / sharp) are installed per-platform inside fetch:dsh, so each
  # runner builds its own closure (no cross-platform bundling).
  # ------------------------------------------------------------------
  build:
    needs: detect-release-type
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: NSIS installer + latest.yml.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_platform: win32-x64
            cache_key: win-x64
            artifact_suffix: ''
          # macOS: no universal binaries — one job per native arch.
          # The x64 job MUST run on the Intel runner: pnpm on arm64
          # runners installs only darwin-arm64 native modules, so the
          # x64 closure would be missing darwin-x64 prebuilds.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle_platform: darwin-x64
            cache_key: x86_64-apple-darwin
            artifact_suffix: ''
          - runner: macos-14
            target: aarch64-apple-darwin
            bundle_platform: darwin-arm64
            cache_key: aarch64-apple-darwin
            artifact_suffix: '-arm64'
    runs-on: ${{ matrix.runner }}
    env:
      # bundle-deps / fetch-node prune and download for this platform.
      DSHD_TARGET_PLATFORM: ${{ matrix.bundle_platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Install Node (matches bundled runtime)
        uses: actions/setup-node@v5
        with:
          node-version-file: desktop/.node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo (registry + toolchain + build artifacts)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            desktop/src-tauri/target
          key: cargo-${{ matrix.cache_key }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.cache_key }}-

      # The closure's build behavior lives in fetch-dsh.cjs (build env, e.g.
      # DSH_BUILD_CLIENT_PROFILE=official) and bundle-deps.cjs (what gets
      # staged). Hash them with the ref, or a fetch-dsh change would silently
      # reuse a stale closure via the cache fast path (v0.4.0 shipped the
      # unbranded "DSH Local Build" engine because of exactly this).
      - name: Cache dsh build closure
        uses: actions/cache@v5
        with:
          path: desktop/.dsh-build
          key: dsh-build-${{ matrix.bundle_platform }}-${{ hashFiles('desktop/dsh-ref.json', 'desktop/scripts/fetch-dsh.cjs', 'desktop/scripts/bundle-deps.cjs') }}

      - name: Cache bundled Node runtime
        uses: actions/cache@v5
        with:
          path: desktop/.sidecar-deps/runtime
          key: node-${{ matrix.bundle_platform }}-${{ hashFiles('desktop/.node-version') }}

      # pnpm is a pure-JS tarball (one artifact serves every platform), so
      # the key deliberately omits bundle_platform — the first platform's
      # download feeds the others.
      - name: Cache bundled pnpm
        uses: actions/cache@v5
        with:
          path: desktop/.sidecar-deps/pnpm
          key: pnpm-${{ hashFiles('desktop/pnpm-version.json') }}

      - name: Cache tauri bundler tools (NSIS toolchain)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: '${{ env.LOCALAPPDATA }}\tauri'
          key: tauri-tools-win

      - name: Install shell dependencies
        # pnpm 11 blocks unapproved dependency build scripts by default
        # (strictDepBuilds). CI never runs esbuild (tsc-only build; the dsh
        # closure's esbuild is pruned by bundle-deps), so disable the strict
        # gate instead of approving scripts that are not needed here.
        run: cd desktop && pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Check version consistency (desktop / tauri.conf.json)
        run: |
          node -e "const d=require('./desktop/package.json').version,t=require('./desktop/src-tauri/tauri.conf.json').version;if(d!==t){console.error('Version mismatch: desktop='+d+' tauri.conf='+t);process.exit(1)}console.log('Versions consistent: '+d)"

      # Signing secrets are OPTIONAL. Never set the env vars to empty
      # strings: tauri's codesign sees APPLE_CERTIFICATE set (even empty)
      # and runs `security import` on an empty file → build fails.
      - name: Configure signing env (macOS only, when secrets exist)
        if: runner.os == 'macOS'
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_API_KEY }}" ]; then
            echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY }}" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
          fi

      # beforeBuildCommand runs fetch:dsh (fast-paths when the closure is
      # cached) → bundle-deps → build:sidecar; DSHD_TARGET_PLATFORM above
      # keeps the native-module pruning aligned with this job's target.
      - name: Clean stale NSIS installers (cached target dir)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The cargo/tauri target cache restores the whole bundle dir, so
          # stale installers from previous versions survive. Wipe the nsis
          # dir BEFORE tauri build — otherwise old Setup-<version>.exe files
          # get globbed into the release and latest.yml.
          $nsisDir = Join-Path $env:GITHUB_WORKSPACE "desktop/src-tauri/target/release/bundle/nsis"
          if (Test-Path $nsisDir) {
            Get-ChildItem $nsisDir -Filter "*.exe" | Remove-Item -Force
          }

      - name: Build Tauri app (NSIS installer)
        if: runner.os == 'Windows'
        timeout-minutes: 90
        run: cd desktop && npx tauri build --bundles nsis

      - name: Build Tauri app (macOS .app bundle)
        if: runner.os == 'macOS'
        # dmg is NOT built here — tauri's bundler drives Finder via
        # AppleScript (TCC automation grant), which hangs on headless
        # runners. The next step packages the dmg with hdiutil.
        timeout-minutes: 90
        run: cd desktop && npx tauri build --bundles app

      # tauri has no artifact-name config (removed in v2) — the NSIS file
      # comes out as DSH Desktop_<v>_x64-setup.exe. Rename to the
      # canonical DSH-Desktop-Setup-<v>.exe.
      - name: Rename installer (updater-friendly name)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = node -p "require('./desktop/package.json').version"
          $nsisDir = Join-Path $env:GITHUB_WORKSPACE "desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem (Join-Path $nsisDir "DSH Desktop_*_x64-setup.exe") | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found in $nsisDir" }
          Move-Item -Force $exe.FullName (Join-Path $nsisDir "DSH-Desktop-Setup-$VERSION.exe")

      - name: Generate latest.yml metadata
        if: runner.os == 'Windows'
        run: |
          $VERSION = node -p "require('./desktop/package.json').version"
          $EXE = "desktop/src-tauri/target/release/bundle/nsis/DSH-Desktop-Setup-$VERSION.exe"
          node desktop/scripts/release-meta.cjs "$EXE" $VERSION

      - name: Package dmg (hdiutil + prebuilt .DS_Store, no AppleScript)
        if: runner.os == 'macOS'
        # electron-builder-style dmg layout via the committed .DS_Store
        # template (app left, /Applications right) — no Finder needed.
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          APP="desktop/src-tauri/target/release/bundle/macos/DSH Desktop.app"
          DMG_DIR="desktop/src-tauri/target/release/bundle/dmg"
          DMG="$DMG_DIR/DSH-Desktop-${VERSION}${{ matrix.artifact_suffix }}.dmg"
          rm -rf "$DMG_DIR"
          mkdir -p "$DMG_DIR"
          STAGING="$(mktemp -d)"
          cp -R "$APP" "$STAGING/DSH Desktop.app"
          ln -s /Applications "$STAGING/Applications"
          cp desktop/scripts/dmg-layout/.DS_Store "$STAGING/.DS_Store"
          # ULMO (LZMA) won the rc2 compression comparison: ~158 MiB vs
          # ~176 MiB for UDBZ (verified on both x64 and arm64).
          for attempt in 1 2 3; do
            if hdiutil create -volname "DSH Desktop" -srcfolder "$STAGING" -ov -format ULMO "$DMG"; then
              break
            fi
            echo "hdiutil create failed (attempt $attempt/3), retrying in 10s..."
            sleep 10
          done
          if [ ! -f "$DMG" ]; then
            echo "hdiutil create failed after 3 attempts"
            exit 1
          fi
          rm -rf "$STAGING"
          ls -lh "$DMG"

      - name: Smoke test (launch app, check dsh web on 3080)
        if: runner.os == 'macOS'
        run: |
          APP="desktop/src-tauri/target/release/bundle/macos/DSH Desktop.app"
          BIN="$APP/Contents/MacOS/dsh-desktop"
          LOG_DIR="$HOME/.dsh/logs"
          ls -la "$APP/Contents/MacOS/" || true
          file "$BIN" || true

          dump_diagnostics() {
            echo "--- app stdout/stderr (/tmp/dsh-smoke.log) ---"
            tail -40 /tmp/dsh-smoke.log 2>/dev/null || true
            echo "--- sidecar.log ---"
            tail -60 "$LOG_DIR/sidecar.log" 2>/dev/null || echo "(no sidecar.log)"
            echo "--- shell.log ---"
            tail -40 "$LOG_DIR/shell.log" 2>/dev/null || echo "(no shell.log)"
            echo "--- packaged resources ---"
            ls -la "$APP/Contents/Resources/sidecar/" 2>/dev/null | head -10 || true
            ls -la "$APP/Contents/Resources/dsh-dist/apps/cli/lib/" 2>/dev/null | head -10 || true
            echo "--- port 3080 listeners ---"
            lsof -nP -iTCP:3080 -sTCP:LISTEN 2>/dev/null || echo "(nothing on 3080)"
            echo "--- process snapshot ---"
            ps -Ao pid,ppid,stat,etime,command | grep -iE "dsh|node" | grep -v grep | head -15 || true
          }

          attempt() {
            local label="$1"
            echo "== smoke attempt $label =="
            "$BIN" > /tmp/dsh-smoke.log 2>&1 &
            local app_pid=$!
            sleep 5
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "WARN: app exited within 5s"
              dump_diagnostics
              return 1
            fi
            # First launch initializes DSH_HOME (profiles/storages) and loads
            # cordis plugins; on cold runners this can take well over 2 min.
            for i in $(seq 1 120); do
              if curl -sf -m 2 -o /dev/null http://127.0.0.1:3080/; then
                echo "dsh web OK on :3080"
                kill "$app_pid" 2>/dev/null || true
                # The shell's exit must take the sidecar + dsh down with it.
                # On macOS/Linux the cleanup is heartbeat-driven: the sidecar
                # self-exits after 3 missed 3s heartbeats and THEN kills dsh
                # (~12s worst case), so poll for the port to close instead of
                # a fixed 2s wait (which falsely flags a healthy shutdown as
                # an orphan and EADDRINUSE-fails the retry).
                local down=false
                for i in $(seq 1 15); do
                  if ! curl -sf -m 2 -o /dev/null http://127.0.0.1:3080/; then
                    down=true
                    break
                  fi
                  sleep 2
                done
                if [ "$down" != "true" ]; then
                  echo "FAIL: dsh still running after app exit (orphan)"
                  # Clean up before the next attempt so the retry doesn't hit
                  # EADDRINUSE from the leftover dsh.
                  pkill -f "$BIN" 2>/dev/null || true
                  pkill -f "$APP/Contents/Resources/sidecar" 2>/dev/null || true
                  sleep 3
                  return 1
                fi
                echo "dsh down after app exit (orphan cleanup OK)"
                return 0
              fi
              sleep 2
            done
            echo "health check failed (attempt $label):"
            dump_diagnostics
            # Clean up before the next attempt.
            kill "$app_pid" 2>/dev/null || true
            sleep 3
            pkill -f "$BIN" 2>/dev/null || true
            pkill -f "$APP/Contents/Resources/sidecar" 2>/dev/null || true
            sleep 2
            return 1
          }

          if attempt "1/2"; then
            exit 0
          fi
          echo "== first attempt failed; retrying once =="
          attempt "2/2"

      # Smoke failures on cold arm64 runners have been flaky (dsh web never
      # appears even though sidecar stays alive). Capture the shell/sidecar
      # logs as artifacts so a genuine packaging break is diagnosable.
      - name: Collect smoke logs (macOS, always)
        if: runner.os == 'macOS' && always()
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/smoke-logs"
          cp -R "$HOME/.dsh/logs/." "$GITHUB_WORKSPACE/smoke-logs/" 2>/dev/null || true

      - name: Upload smoke logs artifact (macOS, always)
        if: runner.os == 'macOS' && always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: smoke-logs-${{ matrix.bundle_platform }}
          path: smoke-logs
          if-no-files-found: warn

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: dsh-desktop-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/DSH-Desktop-Setup-*.exe
            desktop/src-tauri/target/release/bundle/nsis/latest.yml
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: dsh-desktop-mac-${{ matrix.bundle_platform }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/DSH-Desktop-*${{ matrix.artifact_suffix }}.dmg
          if-no-files-found: error

  # Merge the per-arch dmg entries into a single latest-mac.yml so the mac
  # updater can pick its own architecture when it lands.
  mac-meta:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: dsh-desktop-mac-darwin-x64
          path: mac-x64

      - uses: actions/download-artifact@v7
        with:
          name: dsh-desktop-mac-darwin-arm64
          path: mac-arm64

      - name: Generate merged latest-mac.yml (x64 + arm64)
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          # upload-artifact stores the glob's basename at the artifact root
          # (no `dmg/` subdir survives), so look there, not under dmg/.
          DMG_X64=$(ls mac-x64/DSH-Desktop-*.dmg | head -1)
          DMG_ARM64=$(ls mac-arm64/DSH-Desktop-*-arm64.dmg | head -1)
          if [ -z "$DMG_X64" ] || [ -z "$DMG_ARM64" ]; then
            echo "missing dmg: x64='$DMG_X64' arm64='$DMG_ARM64'"
            exit 1
          fi
          # release-meta.cjs writes the yml NEXT TO THE FIRST installer
          # (mac-x64/latest-mac.yml) — no mv needed.
          node desktop/scripts/release-meta.cjs "$DMG_X64" "$DMG_ARM64" "$VERSION" latest-mac.yml

      - name: Upload merged latest-mac.yml
        uses: actions/upload-artifact@v6
        with:
          name: dsh-desktop-mac-meta
          path: mac-x64/latest-mac.yml
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Create Release — runs only after every build finished, attaching all
  # installers + updater metadata in one `gh release create` call.
  # ------------------------------------------------------------------
  create-release:
    needs: [detect-release-type, build, mac-meta]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: dsh-desktop-windows-x64
          path: release-artifacts/windows

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: dsh-desktop-mac-darwin-x64
          path: release-artifacts/mac-x64

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: dsh-desktop-mac-darwin-arm64
          path: release-artifacts/mac-arm64

      - name: Download merged latest-mac.yml
        uses: actions/download-artifact@v7
        with:
          name: dsh-desktop-mac-meta
          path: release-artifacts/mac-meta

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ needs.detect-release-type.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          ASSETS=()
          while IFS= read -r -d '' f; do
            ASSETS+=("$f")
          done < <(find release-artifacts -type f -print0)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "no release assets collected under release-artifacts/"
            exit 1
          fi
          NOTES_FILE="docs/release-notes/${{ github.ref_name }}.md"
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag 2>/dev/null || true
          if [[ -f "$NOTES_FILE" ]]; then
            gh release create "${{ github.ref_name }}" \
              --title "DSH Desktop ${{ github.ref_name }}" \
              --notes-file "$NOTES_FILE" \
              $PRERELEASE_FLAG \
              --draft=false \
              "${ASSETS[@]}"
          else
            gh release create "${{ github.ref_name }}" \
              --title "DSH Desktop ${{ github.ref_name }}" \
              --generate-notes \
              $PRERELEASE_FLAG \
              --draft=false \
              "${ASSETS[@]}"
          fi
