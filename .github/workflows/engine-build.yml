# engine-build.yml — build and publish the DeepSeek Harness engine closure
# (upstream dsh) to this repo's releases.
#
# Two releases per build:
#   engine-v<version> (or engine-<sha12> for untagged refs) — the per-version
#       release: the 3 platform tarballs + that version's engine-manifest.json.
#       Kept forever (it is the version history) and it is the asset host the
#       manifest URLs point at. Published as a normal release and marked
#       "Latest", so the repository homepage release card tracks engine
#       activity (desktop-release.yml passes --latest=false so a desktop
#       release does not steal the slot back).
#   engine — the fixed channel pointer the desktop app's sidecar
#       (engine-updater.ts) fetches: engine-manifest.json ONLY, whose URLs
#       point at the versioned release. That URL never changes, so the updater
#       needs no GitHub API access and no desktop code change.
#
# Stateless design: the pointer's manifest IS the state. `detect` compares the
# upstream's latest tag against the already-published manifest; a difference
# triggers the 3-platform build matrix and an atomic publish.
#
# No artifact-service round-trip: each matrix job uploads its own tarball
# (~210-260 MB) plus a few-hundred-byte engine-fragment-<platform>.json
# straight to the versioned release, and `publish` reads the fragments back
# with `gh release download`, merges the manifest, and deletes the fragments.
# The artifact service answered CreateArtifact/FinalizeArtifact with HTML error
# pages on run 43094179685 (5 retries on both build jobs), which killed an
# otherwise good build — the tarballs never needed to pass through it.
#
# Triggered daily (01:13 UTC and 13:13 UTC — Beijing 09:13 / 21:13, off the
# 02:00 check-upstream cron) and manually via workflow_dispatch (inputs.ref
# overrides the target for tests, e.g. "dsh-v0.1.0-rc.7" or a full sha).

name: engine-build

on:
  schedule:
    - cron: '13 1 * * *'
    - cron: '13 13 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Override target ref/tag (test only, e.g. dsh-v0.1.0-rc.7)'
        required: false
      force:
        description: 'Force rebuild + publish even if the manifest already matches'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  DESKTOP_REPO: tscodeplus/dsh-desktop
  ENGINE_TAG: engine

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      # Versioned release tag (engine-v<version> / engine-<sha12>). Computed
      # here because BOTH the build matrix (uploads its tarball straight to
      # that release) and publish (merges the manifest onto it) need it.
      vtag: ${{ steps.resolve.outputs.vtag }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        name: Resolve target ref and compare with published manifest
        run: |
          set -euo pipefail
          # 1. Target: dispatch override ?? latest upstream tag ?? master HEAD.
          TARGET_INPUT="${{ github.event.inputs.ref || '' }}"
          if [ -n "$TARGET_INPUT" ]; then
            if [[ "$TARGET_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
              REF="$TARGET_INPUT"
              TAG=""
            else
              REF="$(git ls-remote https://github.com/$UPSTREAM_REPO.git "refs/tags/$TARGET_INPUT" | cut -f1)"
              TAG="$TARGET_INPUT"
            fi
          else
            # Only dsh-v* tags are engine candidates — sort -V across all
            # upstream tags could otherwise select a foreign line (e.g. a
            # plain v1.0.0 sorts after dsh-v0.1.0-rc.* and would win).
            TAG="$(git ls-remote --tags --refs https://github.com/$UPSTREAM_REPO.git 'refs/tags/dsh-v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)"
            REF="$(git ls-remote https://github.com/$UPSTREAM_REPO.git "refs/tags/$TAG" | cut -f1)"
          fi
          [ -n "$REF" ] || { echo "could not resolve ref"; exit 1; }
          VERSION="${TAG#dsh-v}"
          [ -n "$VERSION" ] || VERSION="$REF"
          # Tagged upstream ref -> engine-v<version>; bare commit -> engine-<sha12>.
          if [[ "$VERSION" =~ ^[0-9a-f]{40}$ ]]; then
            VTAG="engine-${REF:0:12}"
          else
            VTAG="engine-v${VERSION}"
          fi
          echo "resolved: ref=$REF tag=${TAG:-<none>} version=$VERSION vtag=$VTAG"
          # 2. Already-published manifest (404 → never published → build).
          MANIFEST="$(curl -sfL "https://github.com/$DESKTOP_REPO/releases/download/$ENGINE_TAG/engine-manifest.json" || true)"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          # CHANGED must always be set (the step runs with `set -uo pipefail`).
          CHANGED="false"
          if [ "$FORCE" = "true" ]; then
            CHANGED="true"
            echo "force rebuild requested — building"
          elif [ -n "$MANIFEST" ]; then
            PUBLISHED_REF="$(node -e "const m=JSON.parse(process.argv[1]);const p=m.platforms||{};const refs=Object.values(p).map(x=>x.ref);process.stdout.write([...new Set(refs)].join(' '))" "$MANIFEST")"
            if [ "$PUBLISHED_REF" = "$REF" ]; then
              echo "manifest already at $REF — skipping build"
            else
              CHANGED="true"
              echo "published $PUBLISHED_REF != $REF — building"
            fi
          else
            CHANGED="true"
            echo "no engine release yet — building"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vtag=$VTAG" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            bundle_platform: win32-x64
          - runner: macos-15-intel
            bundle_platform: darwin-x64
          # macos-15 is the arm64 standard image (macos-15-intel is the x64
          # one). Do NOT go back to macos-14: GitHub stopped provisioning
          # that arm64 configuration ("The configuration
          # 'macos-14-arm64-us-default' is not supported"), which failed the
          # whole matrix in 1s.
          - runner: macos-15
            bundle_platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    # Full closure build + pack is ~25 min/platform; a hung runner must not
    # burn an hour of the schedule slot.
    timeout-minutes: 90
    env:
      DSHD_TARGET_PLATFORM: ${{ matrix.bundle_platform }}
      # Engine closures must carry the same LAN/Tailscale patch passes as the
      # desktop release: the sidecar swaps these closures in at runtime on
      # engine update, so a pure closure would silently drop the remote-access
      # patches mid-update. Same gate as desktop-release.yml — exactly 'on'.
      DSHD_ENABLE_REMOTE_ACCESS: on
    steps:
      - uses: actions/checkout@v5
      - name: Pin the target ref in dsh-ref.json
        run: node -e "const fs=require('fs');const p='desktop/dsh-ref.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.ref='${{ needs.detect.outputs.ref }}';d.tag='${{ needs.detect.outputs.tag }}'||null;d.upstreamVersion='${{ needs.detect.outputs.version }}';d.mode=d.tag?'release':'commit';d.note=d.note||'engine channel build';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          # MUST match desktop/.node-version — the bundled runtime ABI.
          node-version-file: desktop/.node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      # The closure's build behavior lives in fetch-dsh.cjs (build env, e.g.
      # DSH_BUILD_CLIENT_PROFILE=official), the remote-access patch passes
      # (patch-*.cjs) and bundle-deps.cjs (what gets staged). Hash them with
      # the ref, or a fetch-dsh change would silently reuse a stale closure
      # via the cache fast path (the v0.4.0 engine was rebuilt-from-cache
      # without the official brand for exactly this).
      - name: Cache dsh build closure
        uses: actions/cache@v5
        with:
          path: desktop/.dsh-build
          key: dsh-build-engine-${{ matrix.bundle_platform }}-${{ needs.detect.outputs.ref }}-${{ hashFiles('desktop/scripts/fetch-dsh.cjs', 'desktop/scripts/bundle-deps.cjs', 'desktop/scripts/patch-webui-index.cjs', 'desktop/scripts/patch-connection-privileges.cjs', 'desktop/scripts/patch-settings-origin.cjs') }}
      - name: Install
        working-directory: desktop
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
      - name: Fetch + build dsh closure
        working-directory: desktop
        run: node scripts/fetch-dsh.cjs
      - name: Bundle deps
        working-directory: desktop
        run: pnpm bundle-deps
      - name: Package engine asset
        working-directory: desktop
        run: node scripts/package-engine.cjs

      # Publish straight to the versioned release instead of round-tripping a
      # ~200-260 MB tarball through the artifact service. That round-trip is
      # exactly what broke in run 43094179685: CreateArtifact / FinalizeArtifact
      # answered with an HTML error page on both build jobs (5 retries each),
      # killing the run even though the closure built fine. The release asset is
      # the real destination, so upload it once from the job that built it.
      # The fragment (a few hundred bytes) rides along; publish downloads the
      # fragments back with `gh release download` and deletes them afterwards,
      # so engine-build.yml no longer depends on upload-artifact at all.
      - name: Upload tarball + fragment to the versioned release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
          VREL_ENGINE: ${{ needs.detect.outputs.vtag }}
          VERSION: ${{ needs.detect.outputs.version }}
          REF: ${{ needs.detect.outputs.ref }}
          UTAG: ${{ needs.detect.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la dsh-engine-*.tar.gz engine-fragment-*.json
          # Draft until `publish` merges the manifest: a half-populated release
          # must not be download-able, and GitHub would otherwise hand the
          # "Latest" slot to a build that has not published anything yet.
          # Idempotent: the three matrix jobs race on the create; the loser
          # gets "already exists" and carries on with its upload. A force
          # rebuild of the same upstream version reuses the release and
          # clobbers its assets.
          gh release create "$VREL_ENGINE" --draft --target master \
            --title "DeepSeek Harness Engine ${VERSION}" \
            --notes "Engine closure for DSH Desktop — upstream ${REF}${UTAG:+ (${UTAG})}. Assets: one dsh-engine-<platform>-<sha12>.tar.gz per platform (win32-x64, darwin-x64, darwin-arm64) plus engine-manifest.json." \
            2>/dev/null || true
          # Release-asset upload is a chunked multipart REST call that can also
          # hiccup; retry rather than losing the 20-minute build.
          for attempt in 1 2 3; do
            if gh release upload "$VREL_ENGINE" dsh-engine-*.tar.gz engine-fragment-*.json --clobber; then
              exit 0
            fi
            echo "upload failed (attempt $attempt/3), retrying in $((attempt * 10))s ..."
            sleep $((attempt * 10))
          done
          echo "::error::could not upload the engine tarball to $VREL_ENGINE"
          exit 1

  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      # Fragments were uploaded next to the tarballs by each build job (they are
      # the only inter-job hand-off — the tarballs never leave the release).
      - name: Download engine fragments from the versioned release
        env:
          VREL_ENGINE: ${{ needs.detect.outputs.vtag }}
        run: |
          set -euo pipefail
          mkdir -p desktop
          for attempt in 1 2 3; do
            if gh release download "$VREL_ENGINE" \
              --pattern 'engine-fragment-*.json' --dir desktop --clobber; then
              break
            fi
            echo "fragment download failed (attempt $attempt/3), retrying in $((attempt * 5))s ..."
            sleep $((attempt * 5))
            [ "$attempt" = 3 ] && exit 1
          done
          ls -la desktop/engine-fragment-*.json
          # All three platforms must be present, or the manifest would describe
          # an engine some users cannot install.
          COUNT=$(ls desktop/engine-fragment-*.json | wc -l | tr -d ' ')
          echo "fragments: $COUNT"
          [ "$COUNT" -eq 3 ] || { echo "::error::expected 3 platform fragments, got $COUNT"; exit 1; }
      - name: Merge manifest
        working-directory: desktop
        env:
          # URLs must point at the versioned release that carries the tarballs;
          # the fixed `engine` pointer gets a byte-identical copy of this file.
          ENGINE_ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.detect.outputs.vtag }}
          ENGINE_RELEASE_TAG: ${{ needs.detect.outputs.vtag }}
        run: node scripts/merge-engine-manifest.cjs
      - name: Publish the versioned engine release
        env:
          VREL_ENGINE: ${{ needs.detect.outputs.vtag }}
          VERSION: ${{ needs.detect.outputs.version }}
          REF: ${{ needs.detect.outputs.ref }}
          UTAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          # Per-version release, kept forever. The tarballs are already on it
          # as a DRAFT uploaded by the build jobs; this step owns the metadata,
          # the manifest, the cleanup and the un-drafting.
          gh release create "$VREL_ENGINE" --draft \
            --title "DeepSeek Harness Engine ${VERSION}" \
            --notes "Engine closure for DSH Desktop — upstream ${REF}${UTAG:+ (${UTAG})}. Assets: one dsh-engine-<platform>-<sha12>.tar.gz per platform (win32-x64, darwin-x64, darwin-arm64) plus engine-manifest.json. Installed desktop apps pick this build up automatically through the engine channel — no desktop rebuild is required." \
            --target master 2>/dev/null || true
          # Refuse to publish a manifest whose tarballs are not all on the
          # release: the updater would then 404 mid-update.
          gh release view "$VREL_ENGINE" --json assets -q '.assets[].name' > /tmp/assets.txt
          missing=0
          for f in desktop/engine-fragment-*.json; do
            name=$(node -p "require('./$f').file")
            if grep -qxF "$name" /tmp/assets.txt; then
              echo "ok: $name"
            else
              echo "::error::tarball $name is not on $VREL_ENGINE"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          gh release upload "$VREL_ENGINE" desktop/engine-manifest.json --clobber
          # Drop what this release no longer references: the staging fragments,
          # plus tarballs for any stale sha12 — an upstream re-tag keeps the
          # engine version while the closure ref (and thus the file name)
          # changes, and force rebuilds would otherwise accumulate assets.
          KEEP=$(node -e "const p=require('./desktop/engine-manifest.json').platforms;process.stdout.write(Object.values(p).map(x=>x.file).join('\n'))")
          for name in $(cat /tmp/assets.txt); do
            case "$name" in
              engine-fragment-*.json) stale=1 ;;
              dsh-engine-*.tar.gz)
                stale=1
                for k in $KEEP; do [ "$k" = "$name" ] && stale=0; done
                ;;
              *) stale=0 ;;
            esac
            if [ "$stale" = "1" ]; then
              echo "removing stale asset: $name"
              gh release delete-asset "$VREL_ENGINE" "$name" --yes || true
            fi
          done
          # Claim the "Latest" slot and make the draft public, so the
          # repository homepage release card tracks engine builds (desktop
          # releases use --latest=false).
          gh release edit "$VREL_ENGINE" --draft=false --latest
      - name: Publish the engine channel pointer
        env:
          PTR_TITLE: DeepSeek Harness Engine (update channel)
          PTR_NOTES: Engine update channel for the DSH Desktop app — engine-manifest.json only. The desktop sidecar (engine-updater.ts) reads this manifest at a fixed URL to discover the newest engine build; the platform tarballs live on the per-version engine-v<version> release the manifest points at.
        run: |
          set -euo pipefail
          # The fixed-URL release the desktop updater reads. Manifest only —
          # the tarballs live on the versioned release, so refreshing this
          # pointer can never break a download URL.
          gh release create $ENGINE_TAG --prerelease --target master \
            --title "$PTR_TITLE" --notes "$PTR_NOTES" || true
          # `create` is a no-op once the release exists (first run creates it),
          # so keep title/notes current explicitly.
          gh release edit $ENGINE_TAG --prerelease --title "$PTR_TITLE" --notes "$PTR_NOTES"
          gh release upload $ENGINE_TAG desktop/engine-manifest.json --clobber
          # The pointer must never hold tarballs: the manifest above points at
          # the versioned release, and pre-split builds parked their tarballs
          # here (legacy). Drop any that remain.
          # (REST API instead of `gh -q` — the query syntax differs across gh
          # versions and has no stable output shape.)
          node -e "
            const { execSync } = require('child_process');
            (async () => {
              const res = await fetch(
                'https://api.github.com/repos/' + process.env.DESKTOP_REPO + '/releases/tags/' + process.env.ENGINE_TAG,
                { headers: { Authorization: 'token ' + process.env.GH_TOKEN } },
              );
              const data = await res.json();
              for (const a of data.assets || []) {
                if (a.name.startsWith('dsh-engine-') && a.name.endsWith('.tar.gz')) {
                  console.log('removing tarball from the pointer release:', a.name);
                  execSync('gh release delete-asset ' + process.env.ENGINE_TAG + ' ' + a.name + ' --yes');
                }
              }
            })().catch((e) => { console.error(e); process.exit(1); });
          "
      - name: Verify the published manifest
        run: |
          curl -sfL "https://github.com/$DESKTOP_REPO/releases/download/$ENGINE_TAG/engine-manifest.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);const ok=Object.keys(m.platforms).length===3;console.log('platforms:',Object.keys(m.platforms).join(','));if(!ok)process.exit(1)})"
      - name: Close bump PRs for the published ref
        # The engine channel now carries this ref to installed apps via
        # engine-updater — by design upstream updates do NOT require
        # rebuilding the desktop app. Any open bump PR for the same ref is
        # a delivered notification, not a pending change: close it instead
        # of leaving it open until the next check-upstream sweep.
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_REF: ${{ needs.detect.outputs.ref }}
        run: |
          set -euo pipefail
          REF12="${PUBLISHED_REF:0:12}"
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | test("^chore/dsh-bump-")) | [.number, .headRefName] | @tsv' |
            while IFS=$'\t' read -r num head; do
              ref="${head#chore/dsh-bump-}"
              if [ "${ref}" = "${REF12}" ]; then
                echo "closing PR #${num} — engine closure for ${REF12} published"
                gh pr close "${num}" --comment \
                  "自动化关闭（engine-build）：ref ${REF12} 的引擎闭包已构建并发布到 engine channel。桌面端经 engine-updater 自动换入更新，无需重新构建桌面端，该 bump PR 无需合并。" \
                  || true
              fi
            done
